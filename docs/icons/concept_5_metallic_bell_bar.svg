<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Metallic Gradient -->
    <radialGradient id="bg-metallic" cx="45%" cy="40%" r="65%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#2D3037"/>
      <stop offset="40%" stop-color="#1F2126"/>
      <stop offset="80%" stop-color="#151619"/>
      <stop offset="100%" stop-color="#0E0F11"/>
    </radialGradient>

    <!-- Metallic Outer Bezel Gradient -->
    <linearGradient id="bezel-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A5E68"/>
      <stop offset="25%" stop-color="#2B2D33"/>
      <stop offset="50%" stop-color="#727782"/>
      <stop offset="75%" stop-color="#1E2024"/>
      <stop offset="100%" stop-color="#464952"/>
    </linearGradient>

    <!-- Inner Shadow & Highlight Rim -->
    <linearGradient id="inner-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Neon Cyan Colors -->
    <linearGradient id="cyan-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DF7FF"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00A6FF"/>
    </linearGradient>

    <linearGradient id="edge-bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="20%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#A6F8FF"/>
      <stop offset="80%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <!-- Subtle Background Texture Pattern -->
    <pattern id="brushed-metal" width="512" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="512" y2="1" stroke="#FFFFFF" stroke-opacity="0.015" stroke-width="1"/>
      <line x1="0" y1="3" x2="512" y2="3" stroke="#000000" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Intense Neon Glow Filters -->
    <filter id="neon-glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="edge-bar-glow" x="-80%" y="-20%" width="260%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow for Icon Base -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- LAYER 1: Base Metallic Squircle & Bezel    -->
  <!-- ========================================== -->
  <g id="Layer_Base_Frame" filter="url(#icon-shadow)">
    <!-- Outer Metallic Bezel -->
    <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bezel-gradient)"/>
    
    <!-- Bezel Inner Border Highlight -->
    <rect x="36" y="36" width="440" height="440" rx="96" ry="96" fill="none" stroke="#000000" stroke-width="4" opacity="0.7"/>

    <!-- Main Metallic Plate Surface -->
    <rect x="42" y="42" width="428" height="428" rx="90" ry="90" fill="url(#bg-metallic)"/>
    
    <!-- Brushed Metal Overlay -->
    <rect x="42" y="42" width="428" height="428" rx="90" ry="90" fill="url(#brushed-metal)"/>

    <!-- Inner Dark Shadow / Lighting Rim -->
    <rect x="42" y="42" width="428" height="428" rx="90" ry="90" fill="url(#inner-rim)"/>
    <rect x="44" y="44" width="424" height="424" rx="88" ry="88" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12"/>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 2: Right Neon Edge Handle Bar       -->
  <!-- ========================================== -->
  <g id="Layer_Neon_Edge_Bar">
    <!-- Ambient Blue Glow onto the metallic plate -->
    <path d="M 426 100 C 440 180, 440 332, 426 412" 
          stroke="#00E5FF" stroke-width="36" stroke-linecap="round" fill="none" opacity="0.25" filter="url(#edge-bar-glow)"/>

    <!-- Wide Neon Outer Glow -->
    <path d="M 432 108 C 442 180, 442 332, 432 404" 
          stroke="#00D2FF" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.6" filter="url(#edge-bar-glow)"/>

    <!-- Solid Edge Handle Bar Body -->
    <path d="M 432 110 C 442 180, 442 332, 432 402" 
          stroke="url(#edge-bar-grad)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#neon-glow-soft)"/>

    <!-- Intense White-Hot Center Core Line -->
    <path d="M 432 120 C 441 185, 441 327, 432 392" 
          stroke="#F0FDFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 3: Notification Bell & Details       -->
  <!-- ========================================== -->
  <g id="Layer_Neon_Bell">
    <!-- Bell Ambient Ambient Halo (Background Glow) -->
    <g filter="url(#neon-glow-strong)" opacity="0.85">
      <!-- Bell Top Ring Loop -->
      <path d="M 230 185 C 230 171, 241 160, 255 160 C 269 160, 280 171, 280 185" 
            stroke="#00E5FF" stroke-width="15" stroke-linecap="round" fill="none"/>

      <!-- Bell Main Body -->
      <path d="M 255 185 
               C 215 185, 185 220, 185 270 
               C 185 305, 172 325, 155 338 
               C 150 342, 154 350, 162 350 
               L 348 350 
               C 356 350, 360 342, 355 338 
               C 338 325, 325 305, 325 270 
               C 325 220, 295 185, 255 185 Z" 
            stroke="#00E5FF" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

      <!-- Bell Clapper (Bottom Tongue) -->
      <path d="M 232 364 C 232 378, 242 388, 255 388 C 268 388, 278 378, 278 364" 
            stroke="#00E5FF" stroke-width="14" stroke-linecap="round" fill="none"/>

      <!-- Bell Center Dot Core -->
      <circle cx="255" cy="265" r="10" fill="#00E5FF"/>
    </g>

    <!-- Bell Sharp Neon Foreground Strokes -->
    <g>
      <!-- Top Loop -->
      <path d="M 230 185 C 230 171, 241 160, 255 160 C 269 160, 280 171, 280 185" 
            stroke="url(#cyan-glow-grad)" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path d="M 230 185 C 230 171, 241 160, 255 160 C 269 160, 280 171, 280 185" 
            stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- Bell Body Outer Silhouette -->
      <path d="M 255 185 
               C 215 185, 185 220, 185 270 
               C 185 305, 172 325, 155 338 
               C 150 342, 154 350, 162 350 
               L 348 350 
               C 356 350, 360 342, 355 338 
               C 338 325, 325 305, 325 270 
               C 325 220, 295 185, 255 185 Z" 
            stroke="url(#cyan-glow-grad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

      <!-- Bell Body Core White Highlight -->
      <path d="M 255 188 
               C 218 188, 189 222, 189 270 
               C 189 303, 177 322, 162 335 
               L 348 335 
               C 333 322, 321 303, 321 270 
               C 321 222, 292 188, 255 188 Z" 
            stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.65"/>

      <!-- Bottom Clapper -->
      <path d="M 232 364 C 232 378, 242 388, 255 388 C 268 388, 278 378, 278 364" 
            stroke="url(#cyan-glow-grad)" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path d="M 232 364 C 232 378, 242 388, 255 388 C 268 388, 278 378, 278 364" 
            stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- Center Glowing Cyan Dot Core -->
      <circle cx="255" cy="265" r="9" fill="#00E5FF"/>
      <circle cx="255" cy="265" r="4.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- LAYER 4: Sound Waves & Interactive Dots    -->
  <!-- ========================================== -->
  <g id="Layer_Sound_Waves_And_Dots">
    <!-- Sound Waves with Glow -->
    <g filter="url(#neon-glow-strong)" opacity="0.8">
      <!-- First Sound Wave Arc -->
      <path d="M 326 215 C 348 238, 348 274, 326 297" 
            stroke="#00E5FF" stroke-width="12" stroke-linecap="round" fill="none"/>
      <!-- Second Sound Wave Arc -->
      <path d="M 346 195 C 378 227, 378 285, 346 317" 
            stroke="#00E5FF" stroke-width="12" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Sharp Sound Waves -->
    <g>
      <path d="M 326 215 C 348 238, 348 274, 326 297" 
            stroke="url(#cyan-glow-grad)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M 326 215 C 348 238, 348 274, 326 297" 
            stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>

      <path d="M 346 195 C 378 227, 378 285, 346 317" 
            stroke="url(#cyan-glow-grad)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M 346 195 C 378 227, 378 285, 346 317" 
            stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
    </g>

    <!-- 3 Message / Signal Dots pointing to the Edge Bar -->
    <g filter="url(#neon-glow-soft)">
      <!-- Dot 1 -->
      <circle cx="366" cy="275" r="6.5" fill="url(#cyan-glow-grad)"/>
      <circle cx="366" cy="275" r="2.5" fill="#FFFFFF"/>

      <!-- Dot 2 -->
      <circle cx="384" cy="275" r="6.5" fill="url(#cyan-glow-grad)"/>
      <circle cx="384" cy="275" r="2.5" fill="#FFFFFF"/>

      <!-- Dot 3 -->
      <circle cx="402" cy="275" r="6.5" fill="url(#cyan-glow-grad)"/>
      <circle cx="402" cy="275" r="2.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
