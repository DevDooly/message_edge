name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Restore Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          KEYSTORE_PATH="$RUNNER_TEMP/notification-edge-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify Tag Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test "v${VERSION_NAME}" = "$GITHUB_REF_NAME"

      - name: Run Tests and Build Release APK
        run: ./gradlew testDebugUnitTest compileDebugKotlin lintRelease assembleRelease assembleMinifiedRelease --no-daemon

      - name: Verify Minified APK
        run: |
          MINIFIED_APK="app/build/outputs/apk/minifiedRelease/app-minifiedRelease.apk"
          test -f "$MINIFIED_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$MINIFIED_APK"

      - name: Verify APK Signature
        run: |
          test -n "$RELEASE_CERT_SHA256"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          NORMALIZED_CERT_OUTPUT="$(printf '%s' "$CERT_OUTPUT" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$NORMALIZED_CERT_OUTPUT" | grep -Fq "$EXPECTED_CERT"

      - name: Prepare APK Asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk "release_assets/NotificationEdge-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release_assets/NotificationEdge.apk"
          sha256sum "release_assets/NotificationEdge-${GITHUB_REF_NAME}.apk" > "release_assets/NotificationEdge-${GITHUB_REF_NAME}.apk.sha256"

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notification-edge-release
          path: release_assets/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notification-edge-release
          path: release_assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Notification Edge ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/NotificationEdge.apk
            release_assets/NotificationEdge-*.apk
            release_assets/NotificationEdge-*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
