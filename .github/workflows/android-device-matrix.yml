name: Android Device Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 5'

permissions:
  contents: read

concurrency:
  group: android-device-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-test:
    name: API ${{ matrix.api-level }} 계측 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            task: pixel2Api26DebugAndroidTest
          - api-level: 31
            task: pixel2Api31DebugAndroidTest
          - api-level: 34
            task: pixel2Api34DebugAndroidTest
          - api-level: 35
            task: pixel2Api35DebugAndroidTest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm

      - name: Run Managed Device Test
        run: ./gradlew "${{ matrix.task }}" --no-daemon
